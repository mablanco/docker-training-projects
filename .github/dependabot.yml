version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Add the directories of each new exercise with Dockerfiles, Compose
  # files or dependency files here, as in the CI matrix. Exercise 01 is left
  # out on purpose: its Ubuntu base must stay on an LTS release.
  - package-ecosystem: "docker"
    directories:
      - "/04/sol"
      - "/05/sol/*"
      - "/06/sol"
      - "/07/sol"
      - "/08/sol"
      - "/09/sol/client"
      - "/09/sol/server"
      - "/10/sol"
      - "/11/sol"
      - "/12/src"
      - "/12/sol"
      - "/13/src/app"
      - "/13/sol"
      - "/14/src"
      - "/14/sol"
      - "/15/src"
      - "/15/sol"
    schedule:
      interval: "weekly"
    ignore:
      # Exercise 05 compares two specific PHP versions, so dependabot must
      # not move one onto the other, and exercise 04 must stay within the
      # PHP versions that its Nextcloud release supports. Changing them is
      # done by hand.
      - dependency-name: "php"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "pip"
    directories:
      - "/08/src"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directories:
      - "/14/src"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directories:
      - "/03/sol"
      - "/04/sol"
      - "/09/sol"
    schedule:
      interval: "weekly"
    ignore:
      # MySQL's major versions alternate between LTS and Innovation releases
      # (8.4 LTS, 9.7 LTS, 26.x Innovation...). Moving to the next LTS is
      # done by hand; dependabot only proposes patch and minor updates.
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major"]
      # Nextcloud supports specific MariaDB releases, so moving to the next
      # major version is done by hand after checking its requirements.
      - dependency-name: "mariadb"
        update-types: ["version-update:semver-major"]
