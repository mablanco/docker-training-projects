version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Only the exercises that are already updated. Add each exercise's
  # directories with Dockerfiles, Compose files or dependency files here
  # when it is updated, as in the CI matrix.
  - package-ecosystem: "docker"
    directories:
      - "/05/sol/*"
      - "/06/sol"
      - "/07/sol"
      - "/08/sol"
      - "/09/sol/client"
      - "/09/sol/server"
      - "/10/sol"
      - "/11/sol"
    schedule:
      interval: "weekly"
    ignore:
      # Exercise 05 compares two specific PHP versions, so dependabot must
      # not move one onto the other. Changing them is done by hand.
      - dependency-name: "php"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "pip"
    directories:
      - "/08/src"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directories:
      - "/03/sol"
      - "/09/sol"
    schedule:
      interval: "weekly"
    ignore:
      # MySQL's major versions alternate between LTS and Innovation releases
      # (8.4 LTS, 9.7 LTS, 26.x Innovation...). Moving to the next LTS is
      # done by hand; dependabot only proposes patch and minor updates.
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major"]
