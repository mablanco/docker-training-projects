version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Only the exercises that are already updated. Add each exercise's
  # solution directories here (Dockerfiles and Compose files) when it is
  # updated, as in the CI matrix.
  - package-ecosystem: "docker"
    directories:
      - "/06/sol"
      - "/09/sol/client"
      - "/09/sol/server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directories:
      - "/03/sol"
      - "/09/sol"
    schedule:
      interval: "weekly"
