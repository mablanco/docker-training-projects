name: Ejercicios

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Cada semana, para detectar soluciones rotas por nuevas versiones de las dependencias.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  solution:
    name: Ejercicio ${{ matrix.exercise }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Añade aquí cada ejercicio cuando su solución tenga un test.sh.
        exercise:
          - '06'
    steps:
      - uses: actions/checkout@v7

      - name: Validar Dockerfiles
        run: |
          find ${{ matrix.exercise }}/sol -name Dockerfile | while read -r f; do
            echo "$f"
            docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" hadolint/hadolint:v2.15.1 < "$f"
          done

      - name: Validar ficheros Compose
        run: |
          find ${{ matrix.exercise }}/sol \( -name 'compose.yaml' -o -name 'docker-compose.yml' \) -print0 \
            | xargs -0 -r -I{} docker compose -f {} config --quiet

      - name: Probar la solución
        run: ${{ matrix.exercise }}/sol/test.sh
