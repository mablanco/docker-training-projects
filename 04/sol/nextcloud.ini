; Recommended values from the Nextcloud administration manual
memory_limit = 512M
upload_max_filesize = 512M
post_max_size = 512M
output_buffering = 0

opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.save_comments = 1

; occ runs from the command line and also uses APCu as local cache
apc.enable_cli = 1
