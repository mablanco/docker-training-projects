name: nextcloud

x-nextcloud: &nextcloud
  build: .
  image: nextcloud-training
  environment:
    MYSQL_HOST: db
    MYSQL_DATABASE: nextcloud
    MYSQL_USER: nextcloud
    MYSQL_PASSWORD: nextcloud-db-password
    REDIS_HOST: redis
    NEXTCLOUD_ADMIN_USER: admin
    NEXTCLOUD_ADMIN_PASSWORD: nextcloud-admin-password
    NEXTCLOUD_TRUSTED_DOMAINS: localhost
  volumes:
    - config:/var/www/html/config
    - data:/var/www/html/data

services:
  app:
    <<: *nextcloud
    ports:
      - "8004:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Same image, different command: runs the background jobs every 5 minutes
  cron:
    <<: *nextcloud
    command: ["cron"]
    # The image healthcheck tests Apache, which does not run here. Check
    # instead that the background jobs ran in the last 10 minutes.
    healthcheck:
      test: ["CMD-SHELL", "[ $$(( $$(date +%s) - $$(runuser -u www-data -- php /var/www/html/occ config:app:get core lastcron || echo 0) )) -lt 600 ]"]
      interval: 1m
      start_period: 10m
      start_interval: 10s
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mariadb:11.8.9
    command: ["--transaction-isolation=READ-COMMITTED", "--innodb-log-file-size=256M"]
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: nextcloud-db-password
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      start_period: 1m

  redis:
    image: redis:8.8.4-alpine3.23
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

volumes:
  config:
  data:
  db:
