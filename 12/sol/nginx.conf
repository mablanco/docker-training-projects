# Nginx configuration for an unprivileged user and a read-only filesystem.
# Without root, the "user" directive has no effect and is left out.
worker_processes auto;

# Everything Nginx writes at runtime goes to /tmp, the only writable path
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        # Ports below 1024 used to need root or the NET_BIND_SERVICE capability
        listen 8080;
        root /usr/share/nginx/html;
    }
}
