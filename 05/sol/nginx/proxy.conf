# One virtual host per PHP version. Nginx picks the server block whose
# server_name matches the Host header of the request.
server {
    listen 80;
    server_name php83.localhost;

    location / {
        # On the user-defined network, the container name is its hostname.
        proxy_pass http://php83;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name php85.localhost;

    location / {
        proxy_pass http://php85;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Any other host name gets a 404 instead of one of the apps.
server {
    listen 80 default_server;
    return 404;
}
