server {
    listen 80;
    root /usr/share/nginx/html;

    # API requests go to the server container. The trailing slash in
    # proxy_pass removes the /api prefix.
    location /api/ {
        proxy_pass http://server:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The app uses HTML5 history routing, so unknown paths load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
